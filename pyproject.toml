[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneray-lfp-visualization"
version = "0.2.0"
description = "Portable SceneRay LFP artifact rejection and spectral parameterization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "matplotlib==3.9.4",
  "pandas==2.2.3",
  "mne==1.9.0",
  "yasa==0.7.0",
  "fooof==1.1.1",
]

[project.scripts]
sceneray-lfp = "sceneray_lfp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
