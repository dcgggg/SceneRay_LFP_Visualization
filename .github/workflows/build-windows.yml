name: Build portable Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: pytest
      - name: Build portable folder
        run: >-
          pyinstaller --noconfirm --clean --onedir --console
          --name SceneRay-LFP
          --paths src
          --collect-all fooof
          --collect-all yasa
          --collect-all mne
          --collect-all lspopt
          run_analysis.py
      - name: Smoke-test portable executable
        run: .\dist\SceneRay-LFP\SceneRay-LFP.exe --help
      - name: Add documentation and licenses
        shell: pwsh
        run: |
          Copy-Item README.md dist/SceneRay-LFP/
          Copy-Item README_中文.md dist/SceneRay-LFP/
          Copy-Item THIRD_PARTY.md dist/SceneRay-LFP/
          Compress-Archive -Path dist/SceneRay-LFP/* -DestinationPath SceneRay-LFP-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SceneRay-LFP-Windows-x64
          path: SceneRay-LFP-Windows-x64.zip
      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" SceneRay-LFP-Windows-x64.zip --generate-notes
